# 人物を登録するヘルパーフロー
#
# 前提: bun run e2e:load でフィクスチャをシミュレーターに読み込んでおくこと
#
# 環境変数:
#   NAME  - 登録する人物の名前（必須）例: "山田 太郎"
#   MEMO  - メモ（任意）。指定した場合はメモ欄に入力する。省略時は空のまま次へ進む
#
# 使用例:
#   - runFlow: ../helpers/register_person.yaml
#     env:
#       NAME: "山田 太郎"
#       MEMO: "テストメモ"  # 省略可
appId: com.dashi296.shyface.dev
env:
  MEMO: ""
---
- runFlow: navigate_to_persons.yaml

- tapOn: "＋"
- assertVisible: "人物を登録"

# Step1: 名前・メモ入力
- tapOn:
    text: "例: 山田 太郎"
- inputText: ${NAME}
- hideKeyboard
# MEMO が渡された場合のみメモ欄に入力する
- runFlow:
    when:
      true: ${MEMO !== ""}
    commands:
      - tapOn: "メモ（任意）"
      - inputText: ${MEMO}
      - hideKeyboard
- tapOn: "次へ"

# Step2: 写真3枚追加（フォトライブラリ）
# 前提: load-fixtures-to-simulator.sh が person_a を最後にロードするため、
#       Recents 先頭3枚は必ず person_a の顔写真（1_front, 2_left, 3_right）になる
- assertVisible: "写真を追加"
- tapOn: "ライブラリ"
# Recents 先頭行の3枚（person_a 顔写真）を選択
- tapOn:
    point: "18%,25%"
- tapOn:
    point: "35%,25%"
- tapOn:
    point: "52%,25%"
- tapOn: "追加"

# Step3: 確認・登録
- tapOn: "確認へ"
- assertVisible: "確認"
- assertVisible: ${NAME}
- tapOn: "登録する"

# ホームに戻る
- tapOn: "ホーム"
