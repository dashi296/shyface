# 人物を登録するヘルパーフロー
#
# 前提: bun run e2e:load でフィクスチャをシミュレーターに読み込んでおくこと
#
# 環境変数:
#   NAME  - 登録する人物の名前（必須）例: "山田 太郎"
#   MEMO  - メモ（任意、省略時は空のまま次へ進む）
#
# 使用例:
#   - runFlow: helpers/register_person.yaml
#     env:
#       NAME: "山田 太郎"
appId: com.dashi296.shyface.dev
---
- runFlow: navigate_to_persons.yaml

- tapOn: "＋"
- assertVisible: "人物を登録"

# Step1: 名前・メモ入力
- tapOn:
    text: "例: 山田 太郎"
- inputText: ${NAME}
- hideKeyboard
- tapOn: "次へ"

# Step2: 写真3枚追加（フォトライブラリ）
# フィクスチャ画像が事前にロードされていることが前提
- assertVisible: "写真を追加"
- tapOn: "ライブラリ"
# グリッド内の写真を3枚選択（最大3枚指定なので一度に選択できる）
- tapOn:
    point: "18%,25%"
- tapOn:
    point: "35%,25%"
- tapOn:
    point: "52%,25%"
- tapOn: "追加"

# Step3: 確認・登録
- tapOn: "確認へ"
- assertVisible: "確認"
- assertVisible: ${NAME}
- tapOn: "登録する"

# ホームに戻る
- tapOn: "ホーム"
